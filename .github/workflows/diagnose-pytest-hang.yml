name: Diagnose Pytest Hang

on:
  push:
    branches:
      - fix/ci-contract-drift-20260806
    paths:
      - .github/diagnose-pytest-hang-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-pytest-hang-20260806
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: volpred_ops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VOLPRED_NO_REMOTE_WRITE: "1"
      VOLPRED_NO_EMAIL: "1"
      VOLPRED_NO_CANONICAL_WRITE: "1"
      VOLPRED_NO_REMOTE_READ: "1"
      VOLPRED_POSTGRES_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/volpred_ops_test
      VOLPRED_ALLOW_DESTRUCTIVE_POSTGRES_TEST: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve active frontend
        id: frontend-target
        shell: bash
        run: |
          echo "repository=$(jq -r '.frontends[.active_frontend].source_repository' config/project_targets.json)" >> "$GITHUB_OUTPUT"
          echo "revision=$(jq -r '.frontends[.active_frontend].source_revision' config/project_targets.json)" >> "$GITHUB_OUTPUT"
      - name: Checkout active frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.frontend-target.outputs.repository }}
          ref: ${{ steps.frontend-target.outputs.revision }}
          path: frontend-v2-fix
          ssh-key: ${{ secrets.VOLPRED_V2_CI_DEPLOY_KEY }}
          persist-credentials: false
      - name: Install system dependencies
        run: sudo python3 scripts/ci_install_system_test_dependencies.py
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Validate feed audience consistency
        run: uv run python scripts/validate_feed_audience.py
      - name: Run verbose suite
        shell: bash
        run: |
          set -o pipefail
          uv run --extra dev python -m pytest -vv -s -p no:cacheprovider \
            --durations=50 -m "not real_queue"
