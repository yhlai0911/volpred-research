name: Export Repair Snapshot

on:
  push:
    branches:
      - fix/ci-contract-drift-20260806
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build a source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude='frontend-v2-fix' \
            --exclude='*.pyc' \
            --exclude='__pycache__' \
            -czf "$RUNNER_TEMP/volpred-repair-snapshot.tar.gz" .

      - name: Upload the source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: volpred-repair-snapshot
          path: ${{ runner.temp }}/volpred-repair-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
