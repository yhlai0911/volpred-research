name: Fix Control Gate Source Health

on:
  push:
    branches:
      - fix/ci-contract-drift-20260806
    paths:
      - .github/fix-control-gate-source-health-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-control-gate-source-health-20260806
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply source-health actuation guard
        run: python3 .github/fix_control_gate_source_health.py

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.12
          uv run --extra dev python -m pytest -q -p no:cacheprovider \
            tests/test_alerts.py::test_check_alert_conditions_marks_registered_self_heal_as_noninterrupting \
            tests/test_control_gate_lifecycle.py
          uv run --extra dev ruff check src/volpred/ops/control_gate_lifecycle.py

      - name: Commit repair and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/volpred/ops/control_gate_lifecycle.py
          git rm \
            .github/fix_control_gate_source_health.py \
            .github/fix-control-gate-source-health-trigger.txt \
            .github/workflows/fix-control-gate-source-health.yml
          git commit -m "fix(ops): fail closed on unhealthy gate evidence"
          git push origin HEAD:fix/ci-contract-drift-20260806
