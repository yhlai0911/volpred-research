name: Refresh Linux CPU Torch Lock

on:
  push:
    branches:
      - fix/linux-cpu-torch-20260806
    paths:
      - pyproject.toml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Refresh universal lockfile
        run: uv lock
      - name: Verify Linux resolves the CPU build
        run: |
          uv sync --frozen --no-dev
          uv run --frozen python - <<'PY'
          import torch
          print("torch", torch.__version__)
          print("torch.version.cuda", torch.version.cuda)
          if torch.version.cuda is not None:
              raise SystemExit("Linux lock resolved a CUDA-enabled PyTorch build")
          PY
      - name: Commit the lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "uv.lock already current"
            exit 0
          fi
          git commit -m "lock: resolve Linux PyTorch from CPU index"
          git push origin "HEAD:${GITHUB_REF_NAME}"
