name: Silent Fallback Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel a still-running gate when a newer commit lands on the same ref — the
# newer tip is what matters. Keyed on ref so PRs/branches stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit silent fallbacks
        run: python scripts/audit_silent_fallbacks.py --strict --baseline storage/qa/silent_fallback_baseline.json
