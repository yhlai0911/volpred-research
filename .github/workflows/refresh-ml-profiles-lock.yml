name: Finalize isolated ML profiles (one-shot)

on:
  push:
    branches:
      - fix/linux-cpu-torch-20260806
    paths:
      - pyproject.toml
      - tests/test_linux_cpu_torch.py
      - .github/workflows/refresh-ml-profiles-lock.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-ml-profiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VOLPRED_EXPECT_CPU_ML: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/linux-cpu-torch-20260806
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-python: true
          prune-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Patch permanent CI profile selection
        run: |
          python - <<'PY'
          from pathlib import Path


          ROOT = Path.cwd()


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one anchor, found {count}"
                  )
              return text.replace(old, new, 1)


          pytest_path = ROOT / ".github/workflows/pytest.yml"
          pytest_text = pytest_path.read_text(encoding="utf-8")
          pytest_text = replace_once(
              pytest_text,
              '      VOLPRED_ALLOW_DESTRUCTIVE_POSTGRES_TEST: "1"\n',
              '      VOLPRED_ALLOW_DESTRUCTIVE_POSTGRES_TEST: "1"\n'
              '      # Only hosted CI promises the CPU-only ML environment.\n'
              '      VOLPRED_EXPECT_CPU_ML: "1"\n',
              "pytest CPU contract env",
          )
          pytest_text = replace_once(
              pytest_text,
              '      - name: Set up Python\n'
              '        run: uv python install 3.12\n'
              '      - name: Stamp a sentinel before the suite runs\n',
              '      - name: Set up Python\n'
              '        run: uv python install 3.12\n'
              '      - name: Sync explicit Linux CPU CI profile\n'
              '        run: >-\n'
              '          uv sync --frozen --no-default-groups\n'
              '          --group dev --group ci-ml --extra dev\n'
              '      - name: Stamp a sentinel before the suite runs\n',
              "pytest explicit CPU sync",
          )
          pytest_text = replace_once(
              pytest_text,
              '        run: uv run python scripts/validate_feed_audience.py\n',
              '        run: uv run --no-sync python scripts/validate_feed_audience.py\n',
              "pytest audience no-resync",
          )
          pytest_text = replace_once(
              pytest_text,
              '        run: uv run --extra dev python -m pytest -q -p no:cacheprovider -m "not real_queue"\n',
              '        run: uv run --no-sync python -m pytest -q -p no:cacheprovider -m "not real_queue"\n',
              "pytest suite no-resync",
          )
          pytest_path.write_text(pytest_text, encoding="utf-8")

          queue_path = ROOT / ".github/workflows/queue-invariants.yml"
          queue_text = queue_path.read_text(encoding="utf-8")
          queue_text = replace_once(
              queue_text,
              '      VOLPRED_NO_REMOTE_READ: "1"\n',
              '      VOLPRED_NO_REMOTE_READ: "1"\n'
              '      # This job explicitly promises the CPU-only ML runtime.\n'
              '      VOLPRED_EXPECT_CPU_ML: "1"\n',
              "queue CPU contract env",
          )
          queue_text = replace_once(
              queue_text,
              '      - name: Set up Python\n'
              '        run: uv python install 3.12\n'
              '      - name: Run the live-queue ratchets\n',
              '      - name: Set up Python\n'
              '        run: uv python install 3.12\n'
              '      - name: Sync explicit Linux CPU CI profile\n'
              '        run: >-\n'
              '          uv sync --frozen --no-default-groups\n'
              '          --group dev --group ci-ml --extra dev\n'
              '      - name: Run the live-queue ratchets\n',
              "queue explicit CPU sync",
          )
          queue_text = replace_once(
              queue_text,
              '        run: uv run --extra dev python -m pytest -q -p no:cacheprovider -m real_queue\n',
              '        run: uv run --no-sync python -m pytest -q -p no:cacheprovider -m real_queue\n',
              "queue ratchets no-resync",
          )
          queue_path.write_text(queue_text, encoding="utf-8")
          PY
      - name: Resolve all mutually exclusive ML profiles
        run: uv lock
      - name: Verify default research profile remains accelerator-capable
        run: |
          set -euo pipefail
          uv export --frozen --no-hashes --no-header --no-annotate > "$RUNNER_TEMP/research.txt"
          grep -Eq '^torch==2\.10\.0([[:space:]]*;|$)' "$RUNNER_TEMP/research.txt"
          grep -Eq '^xgboost==3\.2\.0([[:space:]]*;|$)' "$RUNNER_TEMP/research.txt"
          grep -Eq '^stable-baselines3==2\.9\.0([[:space:]]*;|$)' "$RUNNER_TEMP/research.txt"
          if grep -Eq '^(torch==2\.10\.0\+cpu([[:space:]]*;|$)|xgboost-cpu==)' "$RUNNER_TEMP/research.txt"; then
            echo "::error::default research profile unexpectedly selected CPU-only distributions"
            exit 1
          fi
      - name: Sync the explicit Linux CPU CI profile
        run: >-
          uv sync --frozen --no-default-groups
          --group dev --group ci-ml --extra dev
      - name: Verify CPU runtime, workflow contracts, and source encoding
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_linux_cpu_torch.py \
            tests/test_github_actions_node24.py \
            tests/test_pytest_checkout_history.py \
            tests/test_required_check_contexts.py
          .venv/bin/python scripts/audit_source_encoding.py \
            --roots tests/test_linux_cpu_torch.py
      - name: Remove the write-enabled one-shot workflow
        run: rm .github/workflows/refresh-ml-profiles-lock.yml
      - name: Commit only the validated permanent changes
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          required = {
              ".github/workflows/pytest.yml",
              ".github/workflows/queue-invariants.yml",
              ".github/workflows/refresh-ml-profiles-lock.yml",
              "uv.lock",
          }
          status = subprocess.check_output(
              ["git", "status", "--porcelain"], text=True
          )
          changed = set()
          for line in status.splitlines():
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.add(path)
          unexpected = changed - required
          missing = required - changed
          if unexpected or missing:
              raise SystemExit(
                  f"unexpected paths={sorted(unexpected)}; "
                  f"missing required paths={sorted(missing)}; status={status!r}"
              )
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/workflows/pytest.yml \
            .github/workflows/queue-invariants.yml \
            .github/workflows/refresh-ml-profiles-lock.yml \
            uv.lock
          git diff --cached --check
          git commit -m "ci: isolate CPU ML wheels to hosted runners"
          git push origin HEAD:fix/linux-cpu-torch-20260806
