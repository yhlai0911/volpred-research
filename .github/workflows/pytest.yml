name: Test Suite

# The repo's ~1640 tests had NEVER run in CI (2026-07-10). Cause: importing
# `scripts/supabase_sync.py` raised at module scope when credentials were absent,
# and `volpred.ops` imports it transitively — so pytest collection died on any
# machine without the gitignored `.env.local`. Two tests had been red for days
# before a full local run surfaced them.
#
# Every mechanical gate this repo relies on (dispatch_state schema contract,
# no-raw-kickstart, merge_worktree dedup, scheduler pregate) lives in pytest.
# Until this workflow existed, all of them were gates that only fired when a
# human happened to run them locally.
#
# The tracked repo-root conftest.py is the single pytest owner of all four
# guards. Repeat them at the runner boundary as an independent fail-closed belt
# so a broken/missing conftest cannot let CI touch production before tests fail:
#   VOLPRED_NO_REMOTE_WRITE=1     no Supabase POST/PATCH (2026-06-23 leak incident)
#   VOLPRED_NO_EMAIL=1            no SMTP
#   VOLPRED_NO_CANONICAL_WRITE=1  no writes under storage/ (2026-07-10 leak incident)
#   VOLPRED_NO_REMOTE_READ=1      no production Supabase GET

# Enabled for push/PR only once a credential-less clean checkout ran green:
# 1683 passed, 8 skipped, 0 failed (2026-07-10, fresh worktree, no `.env.local`).
# Getting there took four fixes, all of them pre-existing couplings that only a
# credential-less checkout could expose:
#   - supabase_sync raised at import → now request-time (`require_creds`)
#   - build_knowledge_index.get_client() `sys.exit(1)` on a missing OPTIONAL
#     embedding key → now raises, so the publisher's fail-open path can catch it
#   - config/brief_templates/*.yaml hardcoded the author's absolute repo path,
#     so every brief-backed task would `repo_root_mismatch` on any other machine
#   - tests/test_feed_sync.py issued real reads against PRODUCTION Supabase
# Temporarily narrowed to workflow_dispatch after the first Ubuntu run
# (29085496663) exposed 12 OS/tool-identity couplings despite a clean macOS run.
# The follow-up real runs reduced that set to one host-only alert fixture
# (29088232678); the fix batch that removes that final coupling restores the
# automatic triggers here, so this push is itself the isolated acceptance gate.
# Acceptance met: after the restore, four consecutive Ubuntu runs on main are
# green — 29091180310, 29094498110, 29098177205, 29101441481. The 12 failures of
# 29085496663 are gone (ripgrep installed above; `stat -f` made portable; the
# series_registry condition no longer reads the production feed). Do not re-narrow
# this trigger without a red run id to point at.
on:
  pull_request:
  push:
    branches:
      - main
    # Skips the daily paper/ops refreshes that make up ~38% of main's ~130
    # pushes/day. paths-ignore is fail-safe: a run is skipped ONLY when EVERY
    # changed file matches, so a commit that also touches a .py / config /
    # conftest still runs the full suite.
    #
    # 2026-08-04: this used to be a blanket '**/*.md' on the claim that "the
    # suite reads none of them". It reads a lot of them — 20+ test files assert
    # on AGENTS.md, CLAUDE.md, .claude/rules/*.md, .claude/skills/**/SKILL.md,
    # docs/**, config/governance_shared.md and several experiments/*/README.md.
    # So a governance-only commit could break tests and CI would report nothing.
    # It did: eecf1d67c dropped a section of AGENTS.md that
    # test_check_matt_skills_installation.py asserts on, and the red only
    # surfaced two commits later on an unrelated .py push. The fix for THAT was
    # itself markdown-only, so it would have shipped unverified too.
    #
    # Only paper/ and storage/ markdown stay ignored — both verified to have no
    # test reading a repo copy (matches under tests/ are tmp_path fixtures or
    # prose in comments). Re-verify before widening:
    #   grep -rn 'storage' tests/*.py scripts/tests/*.py | grep '\.md' \
    #     | grep -vE 'tmp_path|tmp_dir|test_dir|\$wt|workdir|/tmp/'
    paths-ignore:
      - 'paper/**'
      # NOT 'storage/**/*.md': tests read storage/event_articles/*/fb_draft.md.
      # That blanket entry was added 2026-08-04 on a grep-based check and the
      # dependency audit caught it the same day — the exact failure mode this
      # file's whole comment block is about.
      - 'storage/*.md'
      - 'storage/analytics/**/*.md'
      - 'storage/drafts/**/*.md'
      - 'storage/lazypack_jobs/**/*.md'
      - 'storage/ops/**/*.md'
      - 'storage/reports/**/*.md'
      # Supervisor state churn. Every entry below is verified absent from
      # config/ci_test_repo_dependencies.json, and
      # scripts/audit_ci_paths_ignore.py check (wired into
      # tests/test_ci_paths_ignore.py) fails the build if that stops holding.
      # Omitting a daemon path here is safe — it only costs an extra run.
      # Listing a path the suite reads is the dangerous direction, which is
      # exactly what the audit blocks.
      - 'storage/ops/agent_briefs/**'
      - 'storage/ops/agent_jobs/**'
      - 'storage/ops/checkup/**'
      - 'storage/ops/compute_queue/**'
      - 'storage/ops/dreaming/**'
      - 'storage/ops/graphify/**'
      - 'storage/ops/liveness_receipts/**'
      - 'storage/ops/reproducibility/**'
      - 'storage/ops/task_execution_fences/**'
      # Listed one by one, not as 'storage/ops/*_state.json': pregate_state.json
      # sits in the same namespace and IS read by the suite.
      - 'storage/ops/ci_watch_state.json'
      - 'storage/ops/claude_version_state.json'
      - 'storage/ops/daily_reader_facing_scan_state.json'
      - 'storage/ops/drain_first_state.json'
      - 'storage/ops/fred_backfill_guard_state.json'
      - 'storage/ops/orphan_held_state.json'
      - 'storage/ops/*_latest.json'
      - 'storage/ops/*-latest.json'
      - 'storage/ops/autonomous_decisions.jsonl'
      - 'storage/ops/incident_candidates.jsonl'
      - 'storage/ops/incidents.json'
      - 'storage/ops/orphan_reap_report.json'
      - 'storage/ops/progress_reports.jsonl'
      - 'storage/ops/release_deadlock_remediation.json'
      - 'storage/ops/remediation_throttle_ledger.jsonl'
      - 'storage/drafts/assets/**'
      - 'storage/logs/**'
      - 'storage/macro/**'
      - 'storage/next_tasks_archive/**'
      - 'storage/reports/token_usage/**'
      - 'storage/work_log.json'
      - 'storage/.knowledge_index_state.json'
      # The single biggest source of cancelled runs: the supervisor rewrites
      # this on every fire, ~90 of the last 200 commits touched it, and until
      # the real_queue split it dragged the whole 15-minute suite along. The
      # ratchets that genuinely read it now live in queue-invariants.yml, which
      # DOES trigger here — the queue is verified faster, not less.
      - 'storage/next_tasks.json'
  workflow_dispatch:

# Rapid successive pushes to main (many land <120s apart, well under the 9-min
# suite runtime) otherwise pile full runs onto already-superseded commits. On a
# linear main the tip's tree contains every prior change, so cancelling an
# in-progress run when a newer commit lands loses no coverage — the newer HEAD is
# tested instead. Keyed on ref so PRs/branches stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Checkout + the full suite normally need ~18 minutes. System dependency
    # downloads are independently bounded below, so 30 minutes leaves retry
    # headroom without allowing a mirror stall to run indefinitely.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: volpred_ops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VOLPRED_NO_REMOTE_WRITE: "1"
      VOLPRED_NO_EMAIL: "1"
      VOLPRED_NO_CANONICAL_WRITE: "1"
      # The fourth guard was missing from this belt while the conftest that sets
      # it was .gitignore'd — so between 2026-07-10 and 2026-07-14 the runner
      # could issue live Supabase reads. conftest.py is tracked again; this line
      # completes the belt that was always meant to survive a broken conftest.
      VOLPRED_NO_REMOTE_READ: "1"
      VOLPRED_POSTGRES_TEST_DSN: >-
        postgresql://postgres:postgres@127.0.0.1:5432/volpred_ops_test
      VOLPRED_ALLOW_DESTRUCTIVE_POSTGRES_TEST: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # The nested-DM fixed-memory gate verifies an external review receipt
          # against its exact reviewed commit. A depth-1 checkout makes that
          # trusted commit look nonexistent and turns a valid K1709 receipt
          # into a false methodology failure.
          fetch-depth: 0
      - name: Resolve the pinned active frontend dependency
        id: frontend-target
        shell: bash
        run: |
          echo "repository=$(jq -r '.frontends[.active_frontend].source_repository' config/project_targets.json)" >> "$GITHUB_OUTPUT"
          echo "revision=$(jq -r '.frontends[.active_frontend].source_revision' config/project_targets.json)" >> "$GITHUB_OUTPUT"
      - name: Checkout the private active frontend at its audited revision
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.frontend-target.outputs.repository }}
          ref: ${{ steps.frontend-target.outputs.revision }}
          path: frontend-v2-fix
          ssh-key: ${{ secrets.VOLPRED_V2_CI_DEPLOY_KEY }}
          persist-credentials: false
      - name: Install system test dependencies
        # `volpred.ops.experiments` shells out to `rg` to find references to an
        # experiment's files before moving them. It is a real runtime dependency
        # of that code path (present on the dev mac via homebrew), not a test
        # convenience — 9 tests in test_experiments_ops.py died on `rg` missing
        # in the first real CI run (29085496663). Installing it here keeps the
        # runner honest about what production actually needs.
        # The deterministic lazypack renderer deliberately refuses a missing
        # CJK font instead of silently drawing tofu. macOS production uses
        # Heiti TC; Ubuntu CI uses the metrically real Noto CJK glyphs.
        # Run the bounded supervisor itself as root. If only apt were sudo,
        # the runner user could not SIGKILL a surviving root dpkg descendant.
        run: sudo python3 scripts/ci_install_system_test_dependencies.py
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Stamp a sentinel before the suite runs
        # Kept outside the checkout so the sentinel itself never dirties the tree.
        run: touch "$RUNNER_TEMP/pre-suite"
      - name: Validate feed audience consistency
        # Replay the same inference used by Publisher against the canonical
        # feed.  This is a corpus invariant, not just a unit test: a new
        # hand-written/general row must not silently bypass the publish gate.
        run: uv run python scripts/validate_feed_audience.py
      - name: Run test suite
        # testpaths = ["tests", "scripts/tests"] (pyproject.toml). No credentials
        # are provided on purpose: a reintroduced import-time raise must fail here,
        # not silently pass because a secret papered over it.
        #
        # -m "not real_queue": the eight ratchets that read the LIVE
        # storage/next_tasks.json run in queue-invariants.yml instead, which is
        # what lets this workflow ignore the queue file. Without the split, a
        # supervisor state commit — landing every few minutes — starts a
        # 15-minute run that the next one cancels; over one recent stretch only
        # 8 of 60 runs on main reached a conclusion at all.
        run: uv run --extra dev python -m pytest -q -p no:cacheprovider -m "not real_queue"
      - name: Assert the suite mutated no repo state
        # One gate for a whole bug class: "a test wrote live repo state". Four
        # instances surfaced on 2026-07-10 alone — the pregate decision log, the
        # cron last-run marker, publication_candidates.json, and (found by the
        # sweep that added this step) the alert dedup ledger + pending_sessions.json
        # + the real control_plane lock. Each was fixed one test at a time; nothing
        # stopped the next one. A dirty tree after a test run IS the bug, whichever
        # file and whichever test.
        #
        # Why not `git status --porcelain` alone, as first proposed: it is blind to
        # .gitignore'd paths, and MOST of this bug class lands there —
        # storage/logs/hourly_pregate.jsonl (.gitignore:81), storage/ops/tasks/ (:60),
        # storage/notifications/*.json (:94), storage/ops/pending_sessions.json (:85).
        # A porcelain-only check reported this very suite CLEAN while it was writing
        # seven files under storage/. So: porcelain for tracked files (it alone sees
        # deletions and content reverts), plus a mtime sweep for everything else.
        #
        # CI-only, deliberately. The dev checkout has scheduled jobs
        # (publication_candidates_refresh 05:30 Taipei, publish_draft, the supervisor
        # daemon) legitimately rewriting these same paths, so the same check in the
        # pre-push hook would fire on cron, not on tests. A clean runner has no such
        # writers, which is the whole reason this belongs here.
        #
        # Residual blind spot, stated rather than papered over: deleting an ignored
        # file leaves no trace in either instrument.
        if: always()
        run: |
          set -uo pipefail
          tracked="$(git status --porcelain)"
          written="$(find storage config paper -type f -newer "$RUNNER_TEMP/pre-suite" 2>/dev/null | sort)"
          if [ -z "$tracked" ] && [ -z "$written" ]; then
            echo "Clean: the suite wrote nothing under storage/, config/ or paper/."
            exit 0
          fi
          echo "::error::The test suite mutated repo state. Tests must write to tmp_path only."
          if [ -n "$tracked" ]; then
            echo "--- tracked files changed (git status --porcelain):"
            printf '%s\n' "$tracked"
          fi
          if [ -n "$written" ]; then
            echo "--- files created or modified under storage|config|paper (includes .gitignore'd):"
            printf '%s\n' "$written"
          fi
          echo ""
          echo "Fix at the writer, not the test: call volpred.ops.canonical_write.guard_canonical_write(path)"
          echo "before the write, so the leak fails loudly however the writer is reached"
          echo "(direct import, subprocess, 'uv run', or an orphaned grandchild process)."
          exit 1
