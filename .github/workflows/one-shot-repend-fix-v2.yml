name: Apply isolated re-pend ownership repair

on:
  push:
    branches:
      - fix/repend-claim-ownership-20260807

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_NO_SYNC: "1"
      VOLPRED_EXPECT_CPU_ML: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/repend-claim-ownership-20260807
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-python: true
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync explicit Linux CPU CI profile
        run: uv sync --frozen --no-default-groups --group dev --group ci-ml --extra dev

      - name: Apply fail-closed lifecycle repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          compute_path = Path("scripts/compute_queue.py")
          compute = compute_path.read_text(encoding="utf-8")

          import_anchor = (
              "from volpred.ops.git_writer_lock import "
              "is_registered_linked_worktree  # noqa: E402\n"
          )
          import_line = (
              "from volpred.ops.next_tasks import "
              "clear_claim_ownership  # noqa: E402\n"
          )
          if import_line not in compute:
              assert compute.count(import_anchor) == 1, "next_tasks import anchor drifted"
              compute = compute.replace(import_anchor, import_anchor + import_line, 1)

          def patch_function(text: str, name: str, status_indent: int) -> str:
              match = re.search(rf"^def {re.escape(name)}\(", text, re.MULTILINE)
              assert match is not None, f"missing function: {name}"
              next_match = re.search(r"^def [A-Za-z_]\w*\(", text[match.end():], re.MULTILINE)
              end = match.end() + next_match.start() if next_match else len(text)
              block = text[match.start():end]
              if "clear_claim_ownership(task)" in block:
                  return text
              anchor = " " * status_indent + 'task["status"] = "pending"\n'
              assert block.count(anchor) == 1, f"{name}: pending transition anchor drifted"
              replacement = " " * status_indent + "clear_claim_ownership(task)\n" + anchor
              new_block = block.replace(anchor, replacement, 1)
              return text[:match.start()] + new_block + text[end:]

          compute = patch_function(compute, "_release_collected_source_task", 8)
          compute = patch_function(compute, "_release_cancelled_source_task", 4)
          compute_path.write_text(compute, encoding="utf-8")

          test_path = Path("tests/test_repend_claim_ownership.py")
          tests = test_path.read_text(encoding="utf-8")

          if "import sys\n" not in tests:
              anchor = "import json\n"
              assert tests.count(anchor) == 1, "test import anchor drifted"
              tests = tests.replace(anchor, anchor + "import sys\n", 1)

          loader_old = '''def _load_script(name: str):
              path = REPO_ROOT / "scripts" / f"{name}.py"
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              assert spec and spec.loader
              spec.loader.exec_module(module)
              return module
          '''
          loader_new = '''def _load_script(name: str):
              path = REPO_ROOT / "scripts" / f"{name}.py"
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              assert spec and spec.loader
              previous = sys.modules.get(name)
              sys.modules[name] = module
              try:
                  spec.loader.exec_module(module)
              finally:
                  if previous is None:
                      sys.modules.pop(name, None)
                  else:
                      sys.modules[name] = previous
              return module
          '''
          assert tests.count(loader_old) == 1, "dynamic script loader anchor drifted"
          tests = tests.replace(loader_old, loader_new, 1)

          exemptions = '''KNOWN_UNCONVERTED_REPEND_SITES = {
              # scripts/compute_queue.py is owned by the concurrent Graphify /
              # resource-aware-dispatch session (see
              # docs/handoffs/2026-08-03_volpred_optimization_continuation.md sec.3).
              # Its two awaiting_agent_job -> pending sites have the same defect and are
              # reported on Issue #9; they must not be edited from this lane.
              ("scripts/compute_queue.py", "_release_collected_source_task"),
              ("scripts/compute_queue.py", "_release_cancelled_source_task"),
          }
          '''
          assert tests.count(exemptions) == 1, "known exemption block drifted"
          tests = tests.replace(
              exemptions,
              "KNOWN_UNCONVERTED_REPEND_SITES: set[tuple[str, str]] = set()\n",
              1,
          )

          insertion_anchor = '''# --------------------------------------------------------------------------
          # 3. Mechanical class gate — a new re-pend site cannot silently reintroduce this
          # --------------------------------------------------------------------------
          '''
          behavioral_tests = '''def _compute_queue_tpc_stub():
              class Stub:
                  TERMINAL_STATUSES = {"succeeded", "failed", "cancelled", "archived"}

                  @staticmethod
                  def _record_status_history(task, **kwargs):
                      task.setdefault("status_history", []).append(dict(kwargs))

              return Stub()


          def _compute_owned_task(*, job_id: str, blocked_reason: str):
              task = _claimed_blocked_task(
                  status="awaiting_agent_job",
                  blocked_reason=blocked_reason,
                  compute_job_id=job_id,
              )
              task.pop("blocked_at", None)
              task.pop("blocked_until", None)
              return task


          def test_compute_queue_collected_release_clears_claim_ownership():
              module = _load_script("compute_queue")
              task = _compute_owned_task(
                  job_id="compute-job-1",
                  blocked_reason="external_compute_receipt_pending_collection",
              )
              job = {
                  "id": "compute-job-1",
                  "source_task_id": "task_under_test",
                  "status": "completed",
              }
              settlement = module._release_collected_source_task(
                  task,
                  job,
                  next_task_id="followup-1",
                  tpc=_compute_queue_tpc_stub(),
              )
              assert settlement and settlement["state"] == "pending_queue_commit"
              assert task["status"] == "pending"
              assert _reconciliation_issues_for(task) == []


          def test_compute_queue_cancel_release_clears_claim_ownership():
              module = _load_script("compute_queue")
              task = _compute_owned_task(
                  job_id="compute-job-2",
                  blocked_reason="external_compute_job_active",
              )
              job = {
                  "id": "compute-job-2",
                  "source_task_id": "task_under_test",
                  "cancel_reason": "operator_cancelled_test",
              }
              assert module._release_cancelled_source_task(
                  task,
                  job,
                  tpc=_compute_queue_tpc_stub(),
              ) is True
              assert task["status"] == "pending"
              assert _reconciliation_issues_for(task) == []


          '''
          assert tests.count(insertion_anchor) == 1, "test insertion anchor drifted"
          tests = tests.replace(insertion_anchor, behavioral_tests + insertion_anchor, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Run focused regression
        run: |
          uv run --no-sync pytest -q tests/test_repend_claim_ownership.py
          uv run --no-sync python scripts/audit_canonical_writers.py
          uv run --no-sync python -m py_compile scripts/compute_queue.py tests/test_repend_claim_ownership.py
          git diff --check

      - name: Commit only permanent repair files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-repend-fix-v2.yml
          git rm .github/copilot/repend-claim-ownership-request.md
          git add scripts/compute_queue.py tests/test_repend_claim_ownership.py
          actual="$(git diff --cached --name-only | sort | tr '\n' ' ')"
          expected=".github/copilot/repend-claim-ownership-request.md .github/workflows/one-shot-repend-fix-v2.yml scripts/compute_queue.py tests/test_repend_claim_ownership.py "
          test "$actual" = "$expected"
          git commit -m "fix(ops): clear claim ownership on compute re-pend"
          git push origin HEAD:fix/repend-claim-ownership-20260807
