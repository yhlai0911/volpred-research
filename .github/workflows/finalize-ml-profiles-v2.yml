# TEMPORARY ISOLATION WORKFLOW.
# It deletes both itself and scripts/finalize_ml_profiles.py before committing.
name: Finalize isolated ML profiles v2

on:
  push:
    branches:
      - fix/linux-cpu-ci-finalizer-20260807
    paths:
      - pyproject.toml
      - tests/test_linux_cpu_torch.py
      - scripts/finalize_ml_profiles.py
      - .github/workflows/finalize-ml-profiles-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-ml-profiles-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VOLPRED_EXPECT_CPU_ML: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/linux-cpu-ci-finalizer-20260807
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-python: true
          prune-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Patch permanent research and CI profiles
        run: python3 scripts/finalize_ml_profiles.py
      - name: Resolve all mutually exclusive ML profiles
        run: uv lock
      - name: Verify the default research profile remains accelerator-capable
        run: |
          set -euo pipefail
          uv export --frozen --no-hashes --no-header --no-annotate > "$RUNNER_TEMP/research.txt"
          grep -Eq '^torch==2\.10\.0([[:space:]]*;|$)' "$RUNNER_TEMP/research.txt"
          grep -Eq '^xgboost==3\.2\.0([[:space:]]*;|$)' "$RUNNER_TEMP/research.txt"
          grep -Eq '^stable-baselines3==2\.9\.0([[:space:]]*;|$)' "$RUNNER_TEMP/research.txt"
          if grep -Eq '^(torch==2\.10\.0\+cpu([[:space:]]*;|$)|xgboost-cpu==)' "$RUNNER_TEMP/research.txt"; then
            echo "::error::default research profile unexpectedly selected CPU-only distributions"
            exit 1
          fi
      - name: Sync the explicit Linux CPU CI profile
        run: >-
          uv sync --frozen --no-default-groups
          --group dev --group ci-ml --extra dev
      - name: Remove all temporary finalization code before auditing workflows
        run: |
          rm .github/workflows/finalize-ml-profiles-v2.yml
          rm scripts/finalize_ml_profiles.py
      - name: Verify CPU runtime and permanent CI contracts
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_linux_cpu_torch.py \
            tests/test_github_actions_node24.py \
            tests/test_pytest_checkout_history.py \
            tests/test_required_check_contexts.py
          .venv/bin/python scripts/audit_source_encoding.py \
            --roots tests/test_linux_cpu_torch.py
      - name: Admit only the seven expected finalization changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          required = {
              ".github/workflows/finalize-ml-profiles-v2.yml",
              ".github/workflows/pytest.yml",
              ".github/workflows/queue-invariants.yml",
              "pyproject.toml",
              "scripts/finalize_ml_profiles.py",
              "tests/test_linux_cpu_torch.py",
              "uv.lock",
          }
          status = subprocess.check_output(
              ["git", "status", "--porcelain"], text=True
          )
          changed = set()
          for line in status.splitlines():
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.add(path)
          unexpected = changed - required
          missing = required - changed
          if unexpected or missing:
              raise SystemExit(
                  f"unexpected paths={sorted(unexpected)}; "
                  f"missing required paths={sorted(missing)}; status={status!r}"
              )
          PY
          git diff --check
      - name: Commit only the validated permanent result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/workflows/finalize-ml-profiles-v2.yml \
            .github/workflows/pytest.yml \
            .github/workflows/queue-invariants.yml \
            pyproject.toml \
            scripts/finalize_ml_profiles.py \
            tests/test_linux_cpu_torch.py \
            uv.lock
          git diff --cached --check
          git commit -m "ci: isolate CPU ML wheels to hosted runners"
          git push origin HEAD:fix/linux-cpu-ci-finalizer-20260807
