name: Canonicalize Governance Repair

on:
  push:
    branches:
      - fix/ci-contract-drift-20260806
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonicalize-governance-repair-20260806
  cancel-in-progress: true

jobs:
  canonicalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconfirm canonical governance and generated files
        run: python3 .github/canonicalize_governance_repair.py

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run governance regression tests
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.12
          uv run --extra dev python -m pytest -q -p no:cacheprovider \
            tests/test_governance_sync.py

      - name: Assert the canonical set is already committed
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- config/governance_shared.md CLAUDE.md AGENTS.md; then
            echo "::error::Canonical governance changed after its verified commit."
            git diff -- config/governance_shared.md CLAUDE.md AGENTS.md
            exit 1
          fi

      - name: Remove the temporary repair infrastructure in one commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/canonicalize_governance_repair.py \
            .github/canonicalize-governance-trigger.txt \
            .github/workflows/canonicalize-governance-repair.yml
          git commit -m "ci: remove temporary canonical governance repair"
          git push origin HEAD:fix/ci-contract-drift-20260806
