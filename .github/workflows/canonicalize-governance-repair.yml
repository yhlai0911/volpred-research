name: Canonicalize Governance Repair

on:
  push:
    branches:
      - fix/ci-contract-drift-20260806
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonicalize-governance-repair-20260806
  cancel-in-progress: true

jobs:
  canonicalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Move intentional governance edits into the canonical source
        run: python3 .github/canonicalize_governance_repair.py

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run governance regression tests
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.12
          uv run --extra dev python -m pytest -q -p no:cacheprovider \
            tests/test_governance_sync.py

      - name: Commit the canonicalized governance set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/governance_shared.md CLAUDE.md AGENTS.md
          if git diff --cached --quiet; then
            echo "Governance is already canonical and synchronized."
            exit 0
          fi
          git commit -m "fix(governance): preserve standing policy in canonical source"
          git push origin HEAD:fix/ci-contract-drift-20260806
