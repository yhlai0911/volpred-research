name: Data Baseline Gates

# Baseline-invariant gates for canonical JSON that Python writers own but jq/Edit
# hand-writes can bypass. Each gate freezes a known pollution count as a baseline
# and fails the build only when a NEW violation is hand-written past the writer.
#
# - knowledge.json provenance: src/volpred/memory/system.py:_append_to_index gates
#   the Python writer; this CI catches jq/Edit hand-edits (baseline in validator).
#   2026-07-10 補上 — 此前 Enforcement Layer Map 宣稱「CI: provenance」但 workflow 不存在。
# - next_tasks.json status vocab: src/volpred/ops/next_tasks.py:write_tasks_to_handle
#   gates the writers; this CI catches jq/Edit hand-edits (27-row baseline).

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel a still-running gate when a newer commit lands on the same ref — the
# newer tip is what matters. Keyed on ref so PRs/branches stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate knowledge.json provenance baseline
        run: python scripts/validate_knowledge_provenance.py
      - name: Validate next_tasks.json status vocabulary baseline
        run: python scripts/validate_next_tasks_status.py
