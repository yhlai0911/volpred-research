[project]
name = "volpred"
version = "0.1.0"
description = "Autonomous volatility prediction research system"
readme = "idea.md"
requires-python = ">=3.12"
dependencies = [
    "arch>=7.0",
    "yfinance>=0.2.30",
    "scipy>=1.12",
    "numdifftools>=0.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
    "scikit-learn>=1.8.0",
    "xgboost>=3.2.0",
    "torch>=2.10.0",
    "emd>=0.8.1",
    "mgarch>=0.3.0",
    "python-multipart>=0.0.22",
    "pypdf2>=3.0.1",
    "lancedb>=0.29.2",
    "google-genai>=1.67.0",
    "pandas-datareader>=0.10.0",
    "hurst>=0.0.5",
    "pytrends>=4.9.2",
    "xlrd>=2.0.2",
    "hmmlearn>=0.3.3",
    "ripser>=0.6.14",
    "persim>=0.3.8",
    "pywavelets>=1.9.0",
    "openai>=2.30.0",
    "tiktoken>=0.12.0",
    "pymupdf>=1.27.2.2",
    "exchange-calendars>=4.5",
]

[project.scripts]
volpred = "volpred.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volpred"]
